name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & test (macOS)
        run: swift test

      - name: Build (iOS)
        run: xcodebuild build -scheme PrefsHelper -destination 'generic/platform=iOS' -quiet
